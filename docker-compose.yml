services:
  api:
    image: health-tracker-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: /data/health-tracker.sqlite
      LOG_LEVEL: info
    volumes:
      - ${HEALTH_TRACKER_DATA:-health_tracker_data}:/data
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: health-tracker-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  health_tracker_data:
